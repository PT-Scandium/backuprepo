# CI: run the test suite on Linux and on Windows, where the build-tagged
# daemon/PID/stop-event code (ADR-016/024) otherwise only gets cross-compiled.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: Windows-specific tests (verbose, so the log shows they ran)
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run "Windows|Proc|StopEvent|SameFolder" ./internal/...
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: build (static, stripped)
        run: go build -trimpath -ldflags="-s -w" -o bb-ci .
